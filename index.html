<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Horizon — Stores Demand Planning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{
    --purple-primary:#9c00ad;
    --purple-dark:#4a0052;
    --purple-secondary:#FDF1FF;
    --purple-tertiary:#FDF9FD;
    --purple-border:#e9d5ff;

    --green:#206E4D;
    --green-bg:#F7FFFC;
    --green-tint:#EAF7F1;
    --green-border:#bbecd4;
    --red:#B11D15;
    --red-bg:#F5DEDD;
    --red-tint:#FEF6F5;
    --red-border:#F5C6C3;
    --amber:#D97706;
    --amber-bg:#FEF3C7;
    --amber-border:#fde68a;
    --blue:#1d4ed8;

    --text-title:#111827;
    --text-body:#374151;
    --text-meta:#6b7280;
    --grey-30:#C6C4CA;
    --grey-40:#938F99;
    --border:#e2e8f0;
    --border-light:#f1f5f9;
    --page-bg:#f8f9fa;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    font-size:12px;font-weight:500;color:var(--text-body);
    background:var(--page-bg);
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  }
  button{font-family:inherit}

  /* ──── Top Nav ───────────────────────────────────────────────────────── */
  .topnav{
    position:sticky;top:0;z-index:50;
    background:#fff;border-bottom:1px solid var(--border);
    box-shadow:0 1px 3px rgba(0,0,0,.04);
    height:56px;display:flex;align-items:center;
    padding:0 28px;
  }
  .topnav-left{display:flex;align-items:center;gap:10px;flex:1}
  .brand-mark{
    width:28px;height:28px;border-radius:8px;
    background:linear-gradient(135deg,#9c00ad 0%,#4a0052 100%);
    display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;
    box-shadow:0 1px 2px rgba(74,0,82,.3);letter-spacing:-.02em;
  }
  .brand-text{display:flex;flex-direction:column;line-height:1.1}
  .brand-name{font-size:14px;font-weight:800;color:var(--text-title);letter-spacing:-.01em}
  .brand-sub{font-size:10px;font-weight:600;color:var(--text-meta);letter-spacing:.04em;text-transform:uppercase;margin-top:2px}
  .topnav-right{display:flex;align-items:center;gap:10px}

  .role-chip{
    display:inline-flex;align-items:center;gap:6px;
    background:#fff;border:1px solid var(--border);
    padding:5px 11px;border-radius:8px;
    font-family:inherit;font-size:11px;font-weight:700;letter-spacing:.02em;
    white-space:nowrap;
  }
  .role-chip.planner{background:var(--purple-secondary);color:var(--purple-primary);border-color:var(--purple-border)}
  .role-chip.admin{background:var(--green-bg);color:var(--green);border-color:var(--green-border)}
  .role-chip i.lead{font-size:13px}
  /* Role pill is a display-only indicator — set by the logged-in user in production.
     Demo role switching lives in the Tweaks panel. */
  .role-chip.static{cursor:default}

  .chip{
    display:inline-flex;align-items:center;gap:6px;
    padding:5px 10px;border-radius:8px;
    font-size:12px;font-weight:600;
    background:#fff;border:1px solid var(--border);
    color:var(--text-body);white-space:nowrap;
  }
  .chip i{font-size:14px;color:var(--text-meta)}
  .chip .chip-label{font-weight:700;color:var(--text-meta);margin-right:2px;font-size:11px;letter-spacing:.02em}
  .chip.cycle{background:var(--purple-tertiary);border-color:var(--purple-border);color:var(--text-title)}
  .chip.cycle i{color:var(--purple-primary)}
  .chip.cycle .chip-label{color:var(--purple-primary)}
  .chip.horizon{background:#fff;border-color:var(--border);color:var(--text-title)}
  .chip.horizon i{color:var(--text-meta)}
  .avatar{
    width:30px;height:30px;border-radius:50%;
    background:linear-gradient(135deg,#9c00ad 0%,#4a0052 100%);
    display:grid;place-items:center;color:#fff;font-weight:700;font-size:11px;
    letter-spacing:.02em;margin-left:4px;
    border:0;padding:0;font-family:inherit;cursor:pointer;
    transition:transform .15s,box-shadow .15s;
  }
  .avatar:hover{transform:scale(1.06);box-shadow:0 0 0 3px var(--purple-secondary)}

  /* ──── Buttons ───────────────────────────────────────────────────────── */
  .btn{
    display:inline-flex;align-items:center;gap:6px;
    border-radius:8px;font-weight:700;cursor:pointer;
    transition:background .18s,border-color .18s,color .18s,opacity .18s;
    border:1px solid transparent;white-space:nowrap;
  }
  .btn-primary{background:var(--purple-primary);color:#fff;font-size:13px;padding:9px 18px}
  .btn-primary:hover:not(:disabled){background:var(--purple-dark)}
  .btn-primary:disabled{opacity:.55;cursor:not-allowed}
  .btn-secondary{background:#fff;border-color:#cbd5e1;color:var(--text-body);font-size:13px;font-weight:600;padding:7px 14px}
  .btn-secondary:hover:not(:disabled){background:#f8fafc;border-color:#94a3b8}
  .btn-ghost{background:transparent;color:var(--purple-primary);font-size:12px;font-weight:600;padding:5px 10px;border-radius:6px}
  .btn-ghost:hover:not(:disabled){background:var(--purple-secondary)}
  .btn-destructive{background:#fff;border-color:#fecaca;color:var(--red);font-size:13px;font-weight:600;padding:7px 14px}
  .btn-destructive:hover:not(:disabled){background:#fef2f2;border-color:#fca5a5}
  .btn-soft-locked{background:#e5e7eb !important;color:#6b7280 !important;border-color:transparent !important}
  .btn-soft-locked:hover{background:#d1d5db !important}

  /* ──── Main ──────────────────────────────────────────────────────────── */
  main{max-width:1180px;margin:0 auto;padding:20px 28px 100px}

  /* ──── Templates popover ─────────────────────────────────────────────── */
  .tools-btn{
    display:inline-flex;align-items:center;gap:6px;
    background:#fff;border:1px solid var(--border);
    color:var(--text-body);font-family:inherit;
    font-size:12px;font-weight:600;
    padding:6px 12px;border-radius:8px;cursor:pointer;
    transition:all .18s;
  }
  .tools-btn:hover{border-color:#94a3b8;color:var(--text-title)}
  .tools-btn i{font-size:14px}
  .tools-btn i.chev{font-size:14px;color:var(--text-meta);margin-left:1px}

  .popover{
    position:fixed;z-index:500;
    background:#fff;border:1px solid var(--border);
    border-radius:10px;
    box-shadow:0 12px 32px rgba(0,0,0,.12);
    width:300px;overflow:hidden;
    animation:popIn .18s ease-out;
  }
  @keyframes popIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
  .popover-head{padding:14px 16px 8px}
  .popover-title{font-size:13px;font-weight:700;color:var(--text-title);letter-spacing:-.01em}
  .popover-sub{font-size:11px;color:var(--text-meta);margin-top:2px;line-height:1.4}
  .popover-all{
    display:flex;align-items:center;gap:8px;
    margin:8px 12px 4px;padding:9px 12px;
    background:var(--purple-tertiary);border:1px solid var(--purple-border);
    border-radius:8px;cursor:pointer;transition:background .15s;
  }
  .popover-all:hover{background:var(--purple-secondary)}
  .popover-all i.lead{font-size:14px;color:var(--purple-primary)}
  .popover-all-text{flex:1}
  .popover-all-text strong{font-size:12px;font-weight:700;color:var(--purple-primary);display:block;letter-spacing:-.01em}
  .popover-all-text span{font-size:10px;color:var(--text-meta);font-weight:500}
  .popover-divider{height:1px;background:var(--border-light);margin:6px 0 4px}
  .popover-list{padding:4px 6px 8px;max-height:280px;overflow-y:auto}
  .popover-item{
    display:flex;align-items:center;gap:8px;
    padding:7px 10px;border-radius:6px;cursor:pointer;transition:background .15s;
  }
  .popover-item:hover{background:var(--page-bg)}
  .popover-item-text{flex:1;min-width:0}
  .popover-item-title{font-size:12px;font-weight:600;color:var(--text-title);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .popover-item-meta{font-size:10px;color:var(--text-meta);font-weight:500;text-transform:uppercase;letter-spacing:.04em;margin-top:1px}
  .popover-item i.dl{font-size:14px;color:var(--grey-40);flex-shrink:0}
  .popover-item:hover i.dl{color:var(--purple-primary)}

  /* ──── Subsection ────────────────────────────────────────────────────── */
  .subsection{margin-top:20px}
  .subsection:first-child{margin-top:0}
  .subsection-head{display:flex;align-items:center;gap:10px;padding:0 0 10px}
  .subsection-label{font-size:10px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.09em;flex-shrink:0}
  .subsection-divider{flex:1;height:1px;background:var(--border)}

  /* ──── Card ──────────────────────────────────────────────────────────── */
  .card{
    background:#fff;border:1px solid var(--border);border-radius:10px;
    box-shadow:0 1px 2px rgba(0,0,0,.02);overflow:hidden;
    transition:background .2s,border-color .2s,transform .15s;margin-bottom:6px;
  }
  .card:hover{border-color:#cbd5e1}
  .card.unhealthy{background:var(--red-tint);border-color:var(--red-border)}
  .card.unhealthy:hover{border-color:#f0a8a3}
  .card.shaking{animation:shake .55s ease-in-out}
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    15%{transform:translateX(-6px)}
    30%{transform:translateX(6px)}
    45%{transform:translateX(-5px)}
    60%{transform:translateX(5px)}
    75%{transform:translateX(-3px)}
    90%{transform:translateX(3px)}
  }
  .card-row{display:flex;align-items:center;gap:14px;padding:10px 16px;min-height:44px}
  .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .dot.healthy  {background:var(--green); box-shadow:0 0 0 3px var(--green-tint)}
  .dot.warning  {background:var(--amber); box-shadow:0 0 0 3px var(--amber-bg)}
  .dot.unhealthy{background:var(--red);   box-shadow:0 0 0 3px var(--red-bg)}
  .card-title{font-size:13px;font-weight:700;color:var(--text-title);letter-spacing:-.01em;flex-shrink:0;white-space:nowrap}

  .count-chip{
    display:inline-flex;align-items:stretch;
    border-radius:10px;font-size:10px;font-weight:700;letter-spacing:.02em;
    overflow:hidden;flex-shrink:0;white-space:nowrap;
  }
  .count-chip.issues  {background:var(--red-bg);  color:var(--red)}
  .count-chip.warnings{background:var(--amber-bg);color:var(--amber)}
  .count-chip > button{
    background:transparent;border:0;cursor:pointer;
    font-family:inherit;font-size:inherit;font-weight:inherit;
    color:inherit;letter-spacing:inherit;
    display:inline-flex;align-items:center;gap:5px;transition:background .15s;
  }
  .count-chip > button.body{padding:3px 6px 3px 9px}
  .count-chip > button.dl{padding:3px 8px 3px 7px;border-left:1px solid rgba(0,0,0,.10)}
  .count-chip.issues   > button:hover{background:rgba(177,29,21,.10)}
  .count-chip.warnings > button:hover{background:rgba(217,119,6,.13)}
  .count-chip i.lead{font-size:11px}
  .count-chip i.chev{font-size:12px;opacity:.7;transition:transform .2s;margin-left:-1px}
  .count-chip.open i.chev{transform:rotate(90deg)}
  .count-chip i.dl-icon{font-size:12px}
  .card-spacer{flex:1}
  .card-ago{font-size:11px;font-weight:600;color:var(--text-meta);font-variant-numeric:tabular-nums;flex-shrink:0;min-width:54px;text-align:right}
  .card.unhealthy .card-ago{color:var(--red)}
  .card-row .btn-primary{padding:7px 14px;font-size:12px}

  .issues-block{background:rgba(245,222,221,.5);border-top:1px solid var(--red-border);padding:8px 18px 10px 38px}
  .warnings-block{background:rgba(254,243,199,.5);border-top:1px solid var(--amber-border);padding:8px 18px 10px 38px}
  .alert-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
  .alert-list li{position:relative;padding-left:14px;font-size:12px;font-weight:500;color:var(--text-body);line-height:1.5}
  .alert-list li::before{content:'';position:absolute;left:0;top:8px;width:5px;height:5px;border-radius:50%;background:var(--red)}
  .alert-list.warnings-list li::before{background:var(--amber)}

  /* ──── Action Bar ────────────────────────────────────────────────────── */
  .action-bar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--border);box-shadow:0 -2px 10px rgba(0,0,0,.05)}
  .action-bar-inner{max-width:1180px;margin:0 auto;padding:12px 28px;display:flex;align-items:center;gap:14px;min-height:64px}
  .action-icon{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:18px;flex-shrink:0}
  .action-icon.healthy  {background:var(--green-tint); color:var(--green)}
  .action-icon.warning  {background:var(--amber-bg);   color:var(--amber)}
  .action-icon.unhealthy{background:var(--red-bg);     color:var(--red)}
  .action-icon.running  {background:var(--purple-secondary); color:var(--purple-primary)}
  .action-icon.complete {background:var(--purple-secondary); color:var(--purple-primary)}
  .action-icon.approved {background:var(--green-tint); color:var(--green)}
  .action-text{flex:1;min-width:0}
  .action-headline{font-size:13px;font-weight:700;color:var(--text-title);letter-spacing:-.01em;line-height:1.3}
  .action-sub{font-size:11px;color:var(--text-meta);font-weight:500;margin-top:2px}
  .action-sub strong{color:var(--text-body);font-weight:600}
  .action-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
  .recheck-pill{
    display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:8px;
    background:#fff;border:1px solid var(--border);font-size:11px;font-weight:600;color:var(--text-meta);
    cursor:pointer;transition:all .18s;
  }
  .recheck-pill:hover:not(:disabled){border-color:#94a3b8;color:var(--text-body)}
  .recheck-pill:disabled{opacity:.5;cursor:not-allowed}
  .recheck-pill i{font-size:13px}
  .recheck-pill strong{color:var(--text-body);font-weight:700;font-variant-numeric:tabular-nums}

  /* ──── Modal ─────────────────────────────────────────────────────────── */
  .modal-backdrop{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);display:grid;place-items:center;padding:24px;animation:fadeBg .2s ease-out}
  @keyframes fadeBg{from{opacity:0}to{opacity:1}}
  .modal{background:#fff;border-radius:12px;width:100%;max-width:560px;box-shadow:0 25px 50px -12px rgba(0,0,0,.25);display:flex;flex-direction:column;max-height:90vh;overflow:hidden;animation:fadeSlideUp .25s ease-out}
  @keyframes fadeSlideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  .modal-head{padding:18px 24px;border-bottom:1px solid var(--border-light);display:flex;align-items:flex-start;gap:12px}
  .modal-head-text{flex:1;min-width:0}
  .modal-title{font-size:16px;font-weight:700;color:var(--text-title);letter-spacing:-.01em}
  .modal-subtitle{font-size:11px;font-weight:500;color:var(--text-meta);margin-top:6px;font-family:ui-monospace,monospace;background:var(--page-bg);padding:4px 8px;border-radius:4px;display:inline-block;word-break:break-all}
  .modal-mode{display:inline-flex;align-items:center;gap:5px;margin-top:8px;padding:3px 9px;border-radius:10px;font-size:10px;font-weight:700;letter-spacing:.02em}
  .modal-mode.partial{background:#eff6ff;color:var(--blue)}
  .modal-mode.complete{background:var(--amber-bg);color:var(--amber)}
  .modal-close{background:transparent;border:0;cursor:pointer;width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:#94a3b8;font-size:18px}
  .modal-close:hover{background:#f1f5f9;color:#ef4444}
  .modal-body{padding:20px 24px;flex:1;overflow-y:auto}
  .modal-foot{padding:14px 24px;border-top:1px solid var(--border-light);display:flex;justify-content:space-between;align-items:center;gap:10px}
  .modal-foot-left{display:flex;align-items:center;gap:10px}
  .modal-foot-right{display:flex;align-items:center;gap:10px}

  .dropzone{display:flex;flex-direction:column;align-items:center;border:1.5px dashed var(--grey-30);border-radius:10px;padding:32px 20px;text-align:center;background:var(--page-bg);transition:border-color .2s,background .2s;cursor:pointer}
  .dropzone.dragging{border-color:var(--purple-primary);background:var(--purple-tertiary)}
  .dropzone.has-file{display:block;border-style:solid;border-color:var(--green);background:var(--green-bg);text-align:left;padding:16px 20px;cursor:default}
  .dropzone.has-file.invalid{border-color:var(--red);background:var(--red-tint)}
  .dropzone-icon{font-size:32px;color:var(--grey-40)}
  .dropzone.has-file .dropzone-icon{color:var(--green);font-size:24px}
  .dropzone.has-file.invalid .dropzone-icon{color:var(--red)}
  .dropzone-msg{font-size:13px;font-weight:700;color:var(--text-title);margin-top:8px}
  .dropzone-sub{font-size:11px;color:var(--text-meta);margin-top:4px}
  .template-link{display:inline-flex;align-items:center;gap:5px;margin-top:14px;font-size:11px;font-weight:600;color:var(--purple-primary);cursor:pointer}
  .template-link:hover{text-decoration:underline}
  .file-pill{display:flex;align-items:center;gap:12px}
  .file-pill-text{flex:1;min-width:0}
  .file-pill-name{font-size:13px;font-weight:700;color:var(--text-title);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .file-pill-meta{font-size:11px;color:var(--text-body);font-weight:500;margin-top:2px}
  .file-pill-remove{background:transparent;border:0;cursor:pointer;color:var(--grey-40);width:28px;height:28px;border-radius:6px;display:grid;place-items:center;font-size:16px}
  .file-pill-remove:hover{background:#fff;color:var(--red)}
  .error-banner{margin-top:14px;background:var(--red-tint);border:1px solid var(--red-border);border-radius:8px;padding:12px 14px;display:flex;align-items:flex-start;gap:10px}
  .error-banner i.lead{color:var(--red);font-size:16px;margin-top:1px}
  .error-banner-text{flex:1}
  .error-banner-text strong{font-size:12px;font-weight:700;color:var(--red)}
  .error-banner-text p{margin:2px 0 0;font-size:11px;color:var(--text-body);font-weight:500;line-height:1.5}
  .error-banner button{background:#fff;border:1px solid #fca5a5;color:var(--red);font-size:11px;font-weight:700;padding:5px 10px;border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;margin-top:6px}
  .error-banner button:hover{background:#fef2f2}
  .pre-submit{margin-top:14px;background:var(--purple-tertiary);border:1px solid var(--purple-border);border-radius:8px;padding:12px 14px}
  .pre-submit-title{font-size:12px;font-weight:700;color:var(--purple-primary)}
  .pre-submit-text{font-size:11px;color:var(--text-body);font-weight:500;margin-top:4px;line-height:1.5}
  .pre-submit-confirm{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;font-weight:600;color:var(--text-title);cursor:pointer}
  .pre-submit-confirm input{accent-color:var(--purple-primary);width:14px;height:14px;cursor:pointer}

  /* ──── Drawer ────────────────────────────────────────────────────────── */
  .drawer-backdrop{position:fixed;inset:0;z-index:900;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .3s ease}
  .drawer-backdrop.open{opacity:1;pointer-events:auto}
  .drawer{position:fixed;right:0;top:0;bottom:0;width:480px;z-index:901;background:#fff;box-shadow:-8px 0 32px rgba(0,0,0,.12);transform:translateX(100%);transition:transform .3s ease;display:flex;flex-direction:column}
  .drawer.open{transform:translateX(0)}
  .drawer-head{padding:18px 24px 16px;border-bottom:1px solid var(--border-light);display:flex;align-items:center;gap:10px;flex-shrink:0}
  .drawer-title{font-size:15px;font-weight:800;color:var(--text-title);letter-spacing:-.01em;flex:1}
  .drawer-status{display:inline-flex;align-items:center;padding:3px 9px;border-radius:10px;font-size:10px;font-weight:700;letter-spacing:.02em}
  .drawer-status.pending{background:var(--purple-secondary);color:var(--purple-primary)}
  .drawer-status.approved{background:var(--green-bg);color:var(--green)}
  .drawer-close{background:transparent;border:0;cursor:pointer;width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:#94a3b8;font-size:18px}
  .drawer-close:hover{background:#f1f5f9;color:var(--text-title)}
  .drawer-body{flex:1;overflow-y:auto;padding:18px 24px 24px}
  .drawer-section{margin-bottom:22px}

<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

  <script type="text/babel">
// ─── tweaks-panel (inlined) ──────────────────────────────────────────────────

const __TWEAKS_STYLE = `
  .twk-panel{position:fixed;right:16px;bottom:16px;z-index:2147483646;width:280px;
    max-height:calc(100vh - 32px);display:flex;flex-direction:column;
    transform:scale(var(--dc-inv-zoom,1));transform-origin:bottom right;
    background:rgba(250,249,247,.78);color:#29261b;
    -webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);
    border:.5px solid rgba(255,255,255,.6);border-radius:14px;
    box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 12px 40px rgba(0,0,0,.18);
    font:11.5px/1.4 ui-sans-serif,system-ui,-apple-system,sans-serif;overflow:hidden}
  .twk-hd{display:flex;align-items:center;justify-content:space-between;padding:10px 8px 10px 14px;cursor:move;user-select:none}
  .twk-hd b{font-size:12px;font-weight:600;letter-spacing:.01em}
  .twk-x{appearance:none;border:0;background:transparent;color:rgba(41,38,27,.55);width:22px;height:22px;border-radius:6px;cursor:default;font-size:13px;line-height:1}
  .twk-x:hover{background:rgba(0,0,0,.06);color:#29261b}
  .twk-body{padding:2px 14px 14px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;overflow-x:hidden;min-height:0;scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.15) transparent}
  .twk-row{display:flex;flex-direction:column;gap:5px}
  .twk-row-h{flex-direction:row;align-items:center;justify-content:space-between;gap:10px}
  .twk-lbl{display:flex;justify-content:space-between;align-items:baseline;color:rgba(41,38,27,.72)}
  .twk-lbl>span:first-child{font-weight:500}
  .twk-val{color:rgba(41,38,27,.5);font-variant-numeric:tabular-nums}
  .twk-sect{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:rgba(41,38,27,.45);padding:10px 0 0}
  .twk-sect:first-child{padding-top:0}
  .twk-field{appearance:none;box-sizing:border-box;width:100%;min-width:0;height:26px;padding:0 8px;border:.5px solid rgba(0,0,0,.1);border-radius:7px;background:rgba(255,255,255,.6);color:inherit;font:inherit;outline:none}
  .twk-field:focus{border-color:rgba(0,0,0,.25);background:rgba(255,255,255,.85)}
  select.twk-field{padding-right:22px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='rgba(0,0,0,.5)' d='M0 0h10L5 6z'/></svg>");background-repeat:no-repeat;background-position:right 8px center}
  .twk-seg{position:relative;display:flex;padding:2px;border-radius:8px;background:rgba(0,0,0,.06);user-select:none}
  .twk-seg-thumb{position:absolute;top:2px;bottom:2px;border-radius:6px;background:rgba(255,255,255,.9);box-shadow:0 1px 2px rgba(0,0,0,.12);transition:left .15s cubic-bezier(.3,.7,.4,1),width .15s}
  .twk-seg.dragging .twk-seg-thumb{transition:none}
  .twk-seg button{appearance:none;position:relative;z-index:1;flex:1;border:0;background:transparent;color:inherit;font:inherit;font-weight:500;min-height:22px;border-radius:6px;cursor:default;padding:4px 6px;line-height:1.2;overflow-wrap:anywhere}
  .twk-toggle{position:relative;width:32px;height:18px;border:0;border-radius:999px;background:rgba(0,0,0,.15);transition:background .15s;cursor:default;padding:0}
  .twk-toggle[data-on="1"]{background:#34c759}
  .twk-toggle i{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
  .twk-toggle[data-on="1"] i{transform:translateX(14px)}
`;

function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    const ro = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(clampToViewport) : null;
    if (ro) { ro.observe(document.documentElement); return () => ro.disconnect(); }
    window.addEventListener('resize', clampToViewport);
    return () => window.removeEventListener('resize', clampToViewport);
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => { setOpen(false); window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*'); };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = { x: startRight - (ev.clientX - sx), y: startBottom - (ev.clientY - sy) };
      clampToViewport();
    };
    const up = () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <React.Fragment>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" onMouseDown={(e) => e.stopPropagation()} onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </React.Fragment>
  );
}

function TweakSection({ label, children }) {
  return <React.Fragment><div className="twk-sect">{label}</div>{children}</React.Fragment>;
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl"><span>{label}</span>{value != null && <span className="twk-val">{value}</span>}</div>
      {children}
    </div>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const valueRef = React.useRef(value);
  valueRef.current = value;
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    const resolve = (s) => { const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s); return m === undefined ? s : typeof m === 'object' ? m.value : m; };
    return <TweakSelect label={label} value={value} options={options} onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;
  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const i = Math.floor(((clientX - r.left - 2) / (r.width - 4)) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };
  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => { if (!trackRef.current) return; const v = segAt(ev.clientX); if (v !== valueRef.current) onChange(v); };
    const up = () => { setDragging(false); window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown} className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb" style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`, width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>{o.label}</button>)}
      </div>
    </TweakRow>

// ─── Excel writer ────────────────────────────────────────────────────────────
function makeExcelFile(filename, sheetMap){
  if (typeof XLSX === 'undefined') return false;
  const wb = XLSX.utils.book_new();
  for (const [name, rows] of Object.entries(sheetMap)) {
    const ws = XLSX.utils.aoa_to_sheet(rows);
    XLSX.utils.book_append_sheet(wb, ws, name);
  }
  XLSX.writeFile(wb, filename);
  return true;
}
function makeJsonFile(filename, obj){
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 0);
  return true;
}
function makeZipPlaceholder(filename, summary){
  // Browser-side zip would need JSZip; for the demo, emit a single-sheet xlsx that
  // explains what would be in the real zip. Keeps the UX consistent (a file lands).
  return makeExcelFile(filename.replace(/\.zip$/i, '.xlsx'), {
    Contents: [['File', 'Description'], ...summary]
  });
}

// ─── Cycle auto-compute (Mon–Sun within calendar month) ─────────────────────
function computeCycleLabel(today){
  today = today || new Date();
  const year = today.getFullYear();
  const month = today.getMonth();
  const day = today.getDate();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const weeks = [];
  let idx = 1, cursor = 1;
  while (cursor <= daysInMonth) {
    const dow = new Date(year, month, cursor).getDay();
    let weekEnd;
    if (cursor === 1) weekEnd = (dow === 0) ? cursor : Math.min(cursor + (7 - dow), daysInMonth);
    else weekEnd = Math.min(cursor + 6, daysInMonth);
    weeks.push({ idx, start: cursor, end: weekEnd });
    idx++; cursor = weekEnd + 1;
  }
  const w = weeks.find(x => day >= x.start && day <= x.end) || weeks[weeks.length - 1];
  const monthName = today.toLocaleString('en-US', { month: 'short' });
  const monthNum = String(month + 1).padStart(2,'0');
  const weekCode = `${year}-${monthNum}-W${w.idx}`;
  const dateRange = `${w.start}–${w.end} ${monthName}`;
  return { weekCode, dateRange, label:`${weekCode} · ${dateRange}`, weekIdx:w.idx, monthName, monthNum, year, weekStart:w.start, weekEnd:w.end };
}

// ─── Planning horizon (remaining weeks of this month + next 6 calendar months) ─
function formatPlanningHorizon(today){
  today = today || new Date();
  const startDay = today.getDate();
  const startMonShort = today.toLocaleString('en-US', { month: 'short' });
  const startYear = today.getFullYear();
  // Last day of (currentMonth + 6). Trick: day 0 of (m+7) === last day of (m+6).
  const endDate = new Date(today.getFullYear(), today.getMonth() + 7, 0);
  const endDay = endDate.getDate();
  const endMonShort = endDate.toLocaleString('en-US', { month: 'short' });
  const endYear = endDate.getFullYear();
  if (startYear === endYear) return `${startDay} ${startMonShort} – ${endDay} ${endMonShort} ${startYear}`;
  return `${startDay} ${startMonShort} ${startYear} – ${endDay} ${endMonShort} ${endYear}`;
}

}

    setToasts(t => [...t, { id, message, variant }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), ttl);
  }, []);
  return [toasts, push];
}

function InfoTooltip({ text }) {
  const [open, setOpen] = useState(false);
  const [pos, setPos] = useState(null);
  const btnRef = useRef(null);

  const show = () => {
    if (!btnRef.current) return;
    const r = btnRef.current.getBoundingClientRect();
    // Position tooltip below; flip above if it would clip viewport bottom
    const top = (r.bottom + 6 + 80 > window.innerHeight) ? (r.top - 6 - 80) : (r.bottom + 6);
    let left = r.left;
    if (left + 300 > window.innerWidth - 8) left = window.innerWidth - 300 - 8;
    if (left < 8) left = 8;
    setPos({ top, left });
    setOpen(true);
  };
  const hide = () => setOpen(false);

  return (
    <React.Fragment>
      <button ref={btnRef} className="card-info"
        onMouseEnter={show} onMouseLeave={hide} onFocus={show} onBlur={hide}
        aria-label="Info">
        <i className="ri-information-line"/>
      </button>
      {open && pos && (
        <div className="info-tooltip" style={{ top: pos.top, left: pos.left }}>{text}</div>
      )}
    </React.Fragment>
  );
}

function UploadCard({ card, shaking, onUpload, pushToast, uploadDisabledReason }) {
  const { health, issues: issueCount, warnings: warningCount } = card.scenario;
  const issues   = card.issuePool.slice(0, issueCount);
  const warnings = card.warningPool.slice(0, warningCount);
  const [issuesOpen,   setIssuesOpen]   = useState(true);
  const [warningsOpen, setWarningsOpen] = useState(false);
  useEffect(() => { if (issueCount === 0) setIssuesOpen(false); else setIssuesOpen(true); }, [issueCount]);
  const uploadDisabled = !!uploadDisabledReason;

  return (
    <div id={`card-${card.id}`} className={`card ${health.toLowerCase()} ${shaking ? 'shaking' : ''}`}>
      <div className="card-row">
        <span className={`dot ${health.toLowerCase()}`} title={health}/>
        <span className="card-title">{card.title}</span>
        <InfoTooltip text={card.info}/>

        {issues.length > 0 && (
          <div className={`count-chip issues ${issuesOpen ? 'open' : ''}`}>
            <button className="body" onClick={() => setIssuesOpen(o => !o)}>
              <i className="ri-error-warning-fill lead"/>
              <span>{issues.length} issue{issues.length === 1 ? '' : 's'}</span>
              <i className="ri-arrow-right-s-line chev"/>
            </button>
            <button className="dl" title="Download issue details" onClick={() => pushToast(`Issue details for ${card.title} downloaded.`, 'success')}>
              <i className="ri-download-2-line dl-icon"/>
            </button>
          </div>
        )}

        {warnings.length > 0 && (
          <div className={`count-chip warnings ${warningsOpen ? 'open' : ''}`}>
            <button className="body" onClick={() => setWarningsOpen(o => !o)}>
              <i className="ri-alert-fill lead"/>
              <span>{warnings.length} warning{warnings.length === 1 ? '' : 's'}</span>
              <i className="ri-arrow-right-s-line chev"/>
            </button>
            <button className="dl" title="Download warning details" onClick={() => pushToast(`Warning details for ${card.title} downloaded.`, 'success')}>
              <i className="ri-download-2-line dl-icon"/>
            </button>
          </div>
        )}

        <span className="card-spacer"/>
        <span className="card-ago">{card.lastUpload.ago}</span>
        <button
          className={`btn btn-primary${uploadDisabled ? ' btn-soft-locked' : ''}`}
          onClick={() => !uploadDisabled && onUpload(card)}
          title={uploadDisabledReason || ''}
          aria-disabled={uploadDisabled}>
          <i className={uploadDisabled ? 'ri-lock-2-line' : 'ri-upload-2-line'} style={{fontSize:14}}/>Upload
        </button>
      </div>

      {issues.length > 0 && issuesOpen && (
        <div className="issues-block">
          <ul className="alert-list">{issues.map((iss, i) => <li key={i}>{iss}</li>)}</ul>
        </div>

      {warnings.length > 0 && warningsOpen && (
        <div className="warnings-block">
          <ul className="alert-list warnings-list">{warnings.map((w, i) => <li key={i}>{w}</li>)}</ul>
        </div>
      )}
    </div>
  );
}

function ActionBar({ cards, role, runState, setRunState, checking, lastChecked, onRecheck, onSoftLockShake, pushToast, onReview, onRequestReject, onLogsOpen, logStatus }) {
  const unhealthy  = cards.filter(c => c.scenario.health === 'Unhealthy');
  const warnCards  = cards.filter(c => c.scenario.health === 'Warning');
  const softLocked = unhealthy.length > 0;
  const [running, setRunning] = useState(false);
  const runId = currentRunId();
  const cycle = computeCycleLabel();

  const handleRun = () => {
    if (softLocked) { onSoftLockShake(); pushToast(`Cannot calculate demand — ${unhealthy.length} card${unhealthy.length===1?'':'s'} unhealthy above`, 'error'); return; }
    setRunning(true); pushToast('Demand calculation started…', 'info');
    setTimeout(() => { setRunning(false); setRunState('Run complete'); pushToast(`Demand calculation complete — Run #${runId} ready for review`, 'success'); }, 1800);
  };
  const handleApprove = () => { setRunState('Approved'); pushToast(`Run #${runId} approved — push to dp_fulcrum queued`, 'success'); };

  const RecheckPill = () => (
    <button className="recheck-pill" onClick={onRecheck} disabled={checking} title="Re-run input health checks across all cards">
      <i className={checking ? 'ri-loader-4-line' : 'ri-refresh-line'} style={checking ? {animation:'spin 1s linear infinite'} : {}}/>
      {checking ? 'Rechecking health…' : <React.Fragment>Recheck health · last <strong>{lastChecked}</strong></React.Fragment>}
    </button>
  );

  let tone, icon, headline, sub, actions;

  if (running) {
    tone='running'; icon='ri-loader-4-line';
    headline=<React.Fragment>Calculating demand for <strong>{cycle.weekCode}</strong>…</React.Fragment>;
    sub=<React.Fragment>Overlaying inputs onto base demand · usually 20–40s</React.Fragment>;
    actions=<React.Fragment><LogsButton onClick={onLogsOpen} status={logStatus}/><button className="btn btn-primary" disabled><span className="spinner"/>Calculating…</button></React.Fragment>;
  } else if (runState === 'Approved') {
    tone='approved'; icon='ri-checkbox-circle-fill';
    headline=<React.Fragment><strong>Cycle pushed to dp_fulcrum</strong> · 32,847 rows</React.Fragment>;
    sub=<React.Fragment>Run #{runId} · approved <strong>just now</strong> by Rohan Verma</React.Fragment>;
    actions=<React.Fragment><LogsButton onClick={onLogsOpen} status={logStatus}/><button className="btn btn-secondary" onClick={onReview}><i className="ri-eye-line" style={{fontSize:14}}/>View calculated demand</button></React.Fragment>;
  } else if (runState === 'Run complete') {
    tone='complete'; icon='ri-check-double-line';
    if (role === 'Admin') {
      headline=<React.Fragment><strong>Run #{runId}</strong> · 32,847 rows · pending your approval</React.Fragment>;
      sub=<React.Fragment>Generated <strong>just now</strong> by Priya Shah · includes calculated + manually uploaded demand</React.Fragment>;
      actions=<React.Fragment>
        <LogsButton onClick={onLogsOpen} status={logStatus}/>
        <button className="btn btn-secondary" onClick={onReview}><i className="ri-eye-line" style={{fontSize:14}}/>Review</button>
        <button className="btn btn-destructive" onClick={onRequestReject}><i className="ri-close-line" style={{fontSize:14}}/>Reject</button>
        <button className="btn btn-primary" onClick={handleApprove}><i className="ri-check-line" style={{fontSize:15}}/>Approve & push</button>
      </React.Fragment>;
    } else {
      headline=<React.Fragment><strong>Run #{runId}</strong> · 32,847 rows · awaiting Admin approval</React.Fragment>;
      sub=<React.Fragment>Generated <strong>just now</strong></React.Fragment>;
      actions=<React.Fragment><LogsButton onClick={onLogsOpen} status={logStatus}/><button className="btn btn-secondary" onClick={onReview}><i className="ri-eye-line" style={{fontSize:14}}/>View calculated demand</button></React.Fragment>;
    }
  } else if (softLocked) {
    tone='unhealthy'; icon='ri-error-warning-fill';
    const names = unhealthy.map(c => c.title).join(', ');
    headline=<React.Fragment><strong>{unhealthy.length} input{unhealthy.length===1?'':'s'} unhealthy</strong> — {names}</React.Fragment>;
    sub=<React.Fragment>Fix the issue{unhealthy.length===1?'':'s'} above before triggering this week's cycle.</React.Fragment>;
    actions=<React.Fragment><RecheckPill/><LogsButton onClick={onLogsOpen} status={logStatus}/><button className="btn btn-primary btn-soft-locked" onClick={handleRun}><i className="ri-lock-2-line" style={{fontSize:15}}/>Submit ROS</button></React.Fragment>;
  } else if (warnCards.length > 0) {
    tone='healthy'; icon='ri-checkbox-circle-fill';
    headline=<React.Fragment><strong>Ready to submit ROS</strong></React.Fragment>;
    sub=<React.Fragment>{warnCards.length} card{warnCards.length===1?'':'s'} with warnings — non-blocking. Review above if intent matters.</React.Fragment>;
    actions=<React.Fragment><RecheckPill/><LogsButton onClick={onLogsOpen} status={logStatus}/><button className="btn btn-primary" onClick={handleRun}><i className="ri-play-fill" style={{fontSize:16}}/>Submit ROS</button></React.Fragment>;
  } else {
    tone='healthy'; icon='ri-checkbox-circle-fill';
    headline=<React.Fragment><strong>All inputs ready</strong> · {cards.length} of {cards.length} healthy</React.Fragment>;
    sub=<React.Fragment>{`Submits ROS for ${cycle.label} — combines forecast output with manually uploaded demand.`}</React.Fragment>;
    actions=<React.Fragment><RecheckPill/><LogsButton onClick={onLogsOpen} status={logStatus}/><button className="btn btn-primary" onClick={handleRun}><i className="ri-play-fill" style={{fontSize:16}}/>Submit ROS</button></React.Fragment>;
  }

  return (
    <div className="action-bar">
      <div className="action-bar-inner">
        <div className={`action-icon ${tone}`}><i className={icon} style={running ? {animation:'spin 1s linear infinite'} : {}}/></div>
        <div className="action-text">
          <div className="action-headline">{headline}</div>
          <div className="action-sub">{sub}</div>
        </div>
        <div className="action-actions">{actions}</div>
      </div>
    </div>
  );
}

  const trimmed = remarks.trim();
  const tooShort = trimmed.length < 3;
  const ref = useRef(null);

  useEffect(() => {

            <div className="modal-title">Reject Run #{runId}</div>
            <div style={{fontSize:11,color:'var(--text-meta)',fontWeight:500,marginTop:6,lineHeight:1.5}}>
              The run will move back to <strong>Pre-run</strong>. Add remarks so the planner knows what to fix before re-calculating.
            </div>
          </div>
          <button className="modal-close" onClick={onClose}><i className="ri-close-line"/></button>
        </div>

        <div className="modal-body">
          <label htmlFor="reject-remarks" style={{display:'block',fontSize:12,fontWeight:600,color:'var(--text-body)',marginBottom:6}}>
            Rejection remarks <span style={{color:'var(--red)'}}>*</span>
          </label>
          <textarea
            id="reject-remarks"
            ref={ref}
            value={remarks}
            onChange={e => setRemarks(e.target.value)}
            placeholder="e.g. ROS multipliers for Lakmé look inflated — check national rows before re-running."
            rows={5}
            style={{
              width:'100%', resize:'vertical',
              border:'1px solid #e4e7eb', borderRadius:6, padding:'8px 12px',
              fontSize:12, color:'var(--text-body)', background:'#fff',
              fontFamily:'inherit', boxSizing:'border-box', lineHeight:1.5,
              outline:'none',
            }}
          />
          <div style={{fontSize:11,color:'var(--text-meta)',marginTop:4,fontWeight:500}}>
            Remarks are logged with the run and shown to the planner in the rejection toast.
          </div>
        </div>

        <div className="modal-foot">
          <div className="modal-foot-left"/>
          <div className="modal-foot-right">
            <button className="btn btn-secondary" onClick={onClose}>Cancel</button>
            <button
              className="btn btn-destructive"
              disabled={tooShort}
              onClick={() => onConfirm(trimmed)}
              title={tooShort ? 'Add remarks (min. 3 characters) to reject' : ''}
              style={tooShort ? {opacity:.5, cursor:'not-allowed'} : {}}>
              <i className="ri-close-line" style={{fontSize:14}}/>Reject run
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

function UploadModal({ card, onClose, pushToast, onSuccess }) {
  const [stage, setStage] = useState('idle');
  const [fileName, setFileName] = useState(null);
  const [dragging, setDragging] = useState(false);
  const [confirmed, setConfirmed] = useState(false);
  const [natPlanDone, setNatPlanDone] = useState(false);
  const isRos = card.id === 'ros';

  const acceptFile = (name) => { setFileName(name); setStage(name.toLowerCase().includes('bad') ? 'invalid' : 'valid'); };
  const onDrop     = (e) => { e.preventDefault(); setDragging(false); const f = e.dataTransfer.files?.[0]; if (f) acceptFile(f.name); };
  const onPickFile = (e) => { const f = e.target.files?.[0]; if (f) acceptFile(f.name); };

  const simulateError = (e) => { e.preventDefault(); e.stopPropagation(); setFileName('demo_invalid_upload.xlsx'); setStage('invalid'); pushToast('Validation failed — download annotated file to fix', 'error'); };

  const downloadAnnotated = () => {
    const sample = ERROR_SAMPLES[card.id] || ERROR_SAMPLES.usm;
    const fname = `${card.id}_validation_errors.xlsx`;
    const ok = makeExcelFile(fname, { Errors: [sample.cols, ...sample.rows] });
    pushToast(ok ? `Downloaded ${fname}` : 'Excel library not loaded', ok ? 'success' : 'error');
  };

  const downloadNatPlan = () => {
    const fname = `national_buying_plan_comparison.xlsx`;
    const ok = makeExcelFile(fname, {
      CurrentPlan: [['MPC','Store','Month','Units (current)'], ['MPC-4421','S-101','2026-05',104], ['MPC-3318','S-103','2026-05',73]],
      FuturePlan:  [['MPC','Store','Month','Units (future = max(MDQ, ROS×DOI))'], ['MPC-4421','S-101','2026-05',125], ['MPC-3318','S-103','2026-05',88]],
    });
    if (ok) { setNatPlanDone(true); pushToast('Comparison file downloaded — Submit enabled', 'success'); }
    else pushToast('Excel library not loaded', 'error');
  };

  const submitDisabled =
    stage !== 'valid' ||
    (card.mode === 'Complete-only' && !confirmed) ||
    (isRos && !natPlanDone);

  const handleSubmit = () => {
    if (submitDisabled) return;
    setStage('submitting');
    setTimeout(() => { onSuccess(card); pushToast(`${card.title} updated — 1,289 rows pushed.`, 'success'); onClose(); }, 1100);
  };

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <div className="modal-head">
          <div className="modal-head-text">
            <div className="modal-title">Update {card.title}</div>
            <div className="modal-subtitle">{card.columns}</div>
            <div><span className={`modal-mode ${card.mode === 'Partial' ? 'partial' : 'complete'}`}>{card.mode}</span></div>
          </div>
          <button className="modal-close" onClick={onClose}><i className="ri-close-line"/></button>
        </div>

        <div className="modal-body">
          {!fileName && (
            <React.Fragment>
              <label className={`dropzone ${dragging ? 'dragging' : ''}`}
                onDragOver={e => { e.preventDefault(); setDragging(true); }}
                onDragLeave={() => setDragging(false)} onDrop={onDrop}>
                <i className="ri-upload-cloud-2-line dropzone-icon"/>
                <div className="dropzone-msg">Drag &amp; drop file here or browse</div>
                <div className="dropzone-sub">Accepts .csv and .xlsx · Max 10 MB</div>
                <span className="template-link" onClick={(e) => {
                  e.preventDefault(); e.stopPropagation();
                  const schema = TEMPLATE_SCHEMA[card.template];
                  if (!schema) { pushToast(`Template missing for ${card.title}`, 'error'); return; }
                  const fname = `${card.template}.xlsx`;
                  const ok = makeExcelFile(fname, { [schema.name]: [schema.cols, ...schema.rows] });
                  pushToast(ok ? `Downloaded ${fname}` : 'Excel library not loaded', ok ? 'info' : 'error');
                }}>
                  <i className="ri-download-line"/>Don't have a file? Download the template
                </span>
                <input type="file" accept=".csv,.xlsx" style={{display:'none'}} onChange={onPickFile}/>
              </label>
              <a className="demo-error-link" onClick={simulateError}>Demo: simulate validation error →</a>
            </React.Fragment>
          )}

          {fileName && (
            <div className={`dropzone has-file ${stage === 'invalid' ? 'invalid' : ''}`}>
              <div className="file-pill">
                <i className={`${stage === 'invalid' ? 'ri-error-warning-line' : 'ri-file-excel-2-line'} dropzone-icon`}/>
                <div className="file-pill-text">
                  <div className="file-pill-name">{fileName}</div>
                  <div className="file-pill-meta">{stage === 'invalid' ? 'Parsed · 3 validation errors' : stage === 'submitting' ? 'Submitting…' : 'Parsed · 1,289 rows · all validations passed'}</div>
                </div>
                <button className="file-pill-remove" onClick={() => { setFileName(null); setStage('idle'); setConfirmed(false); setNatPlanDone(false); }}><i className="ri-close-line"/></button>
              </div>
            </div>
          )}

          {stage === 'invalid' && (
            <div className="error-banner">
              <i className="ri-error-warning-fill lead"/>
              <div className="error-banner-text">
                <strong>{(ERROR_SAMPLES[card.id]?.rows.length ?? 3)} rows failed validation</strong>
                <p>Download the annotated file, fix the highlighted rows offline, and re-upload. Nothing was written.</p>
                <button onClick={downloadAnnotated}><i className="ri-download-line"/>Download annotated</button>
              </div>
            </div>
          )}

          {isRos && stage === 'valid' && (
            <React.Fragment>
              <div className="nat-banner">
                <i className="ri-alert-fill"/>
                <span>If the file contains <strong>geo_granularity = national</strong> rows, download and review the national buying plan comparison before submitting.</span>
              </div>
              {!natPlanDone ? (
                <div className="dl-gate">
                  <div className="dl-gate-text">
                    <strong>National buying plan comparison</strong>
                    Sheet 1: current plan. Sheet 2: future plan = max(MDQ, ROS × DOI) at MPC × Store × Month. Required before Submit.
                  </div>
                  <button className="btn btn-secondary" onClick={downloadNatPlan}><i className="ri-download-2-line" style={{fontSize:14}}/>Download</button>
                </div>
              ) : (
                <div className="dl-gate">
                  <div className="dl-gate-done"><i className="ri-checkbox-circle-fill"/>Comparison downloaded — Submit enabled</div>
                </div>
              )}
            </React.Fragment>
          )}

          {stage === 'valid' && card.mode === 'Complete-only' && (
            <div className="pre-submit">
              <div className="pre-submit-title">Complete-update — review before submitting</div>
              <div className="pre-submit-text">This upload will <strong>replace the entire {card.title} list</strong>. 1,289 pairs will be added or retained · 23 pairs currently present will be removed.</div>
              <label className="pre-submit-confirm">
                <input type="checkbox" checked={confirmed} onChange={e => setConfirmed(e.target.checked)}/>
                I understand this is a complete replacement, not a partial update.
              </label>
            </div>
          )}
        </div>

        <div className="modal-foot">
          <div className="modal-foot-left"/>
          <div className="modal-foot-right">
            <button className="btn btn-secondary" onClick={onClose}>Cancel</button>
            <button className="btn btn-primary" disabled={submitDisabled} onClick={handleSubmit}>
              {stage === 'submitting' ? <React.Fragment><span className="spinner"/>Submitting…</React.Fragment> : <React.Fragment>Submit upload</React.Fragment>}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [checking, setChecking]   = useState(false);
  const [lastChecked, setLastChecked] = useState('14:32');
  const [shakeIds, setShakeIds]   = useState([]);
  const [modalCard, setModalCard] = useState(null);
  const [toasts, pushToast]       = useToasts();
  const [fixedCards, setFixedCards] = useState({});
  const [reviewOpen, setReviewOpen] = useState(false);
  const [logsOpen, setLogsOpen]   = useState(false);
  const [rejecting, setRejecting] = useState(false);

  const resolvedCards = useMemo(() => {
    const scen = SCENARIOS[t.scenario] || SCENARIOS['Mixed'];
    return CARDS.map(c => fixedCards[c.id]
      ? { ...c, scenario: { health:'Healthy', issues:0, warnings:0 }, lastUpload:{ ago:'just now' } }
      : { ...c, scenario: scen[c.id] }
    );
  }, [t.scenario, fixedCards]);

  // ── Run history: prepend current cycle's run if it exists ───────────────
  const runId = currentRunId();
  const cycle = computeCycleLabel();
  const cycleLabel = `${cycle.weekCode} · ${cycle.dateRange}`;
  const logEntries = useMemo(() => {
    const list = [...PAST_LOGS];
    if (t.runState === 'Run complete') {
      list.unshift({ runId, cycle:cycleLabel, status:'Pending', generatedAt:'just now', generatedBy:'Priya Shah', rows:32847, stores:166, mpcs:1247 });
    } else if (t.runState === 'Approved') {
      list.unshift({ runId, cycle:cycleLabel, status:'Approved', generatedAt:'just now', generatedBy:'Priya Shah', actionedBy:'Rohan Verma', actionedAt:'just now', rows:32847, stores:166, mpcs:1247 });
    }
    return list;
  }, [t.runState, runId, cycleLabel]);
  const logStatus = logEntries[0].status.toLowerCase(); // 'pending' | 'approved' | 'rejected'

  // When a run is awaiting approval, lock further input uploads.
  const uploadDisabledReason = t.runState === 'Run complete'
    ? `Run #${runId} is awaiting Admin approval — approve or reject the open run before uploading new inputs.`
    : null;

  useEffect(() => { setFixedCards({}); }, [t.scenario]);

  const triggerRecheck = useCallback(() => {
    setChecking(true);
    setTimeout(() => {
      setChecking(false);
      const allFixed = {};
      CARDS.forEach(c => { allFixed[c.id] = true; });
      setFixedCards(allFixed);
      const now = new Date();
      setLastChecked(`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`);
      pushToast('Health check complete — all inputs healthy', 'success');
    }, 1100);
  }, [pushToast]);

  const softLockShake = useCallback(() => {
    const ids = resolvedCards.filter(c => c.scenario.health === 'Unhealthy').map(c => c.id);
    setShakeIds(ids);
    if (ids[0]) { const el = document.getElementById(`card-${ids[0]}`); if (el) window.scrollBy({ top: el.getBoundingClientRect().top - 160, behavior:'smooth' }); }
    setTimeout(() => setShakeIds([]), 600);
  }, [resolvedCards]);

  const handleApprove = () => { const id = currentRunId(); setTweak('runState', 'Approved'); pushToast(`Run #${id} approved — push to dp_fulcrum queued`, 'success'); };
  const requestReject = () => { setReviewOpen(false); setRejecting(true); };
  const confirmReject = (remarks) => {
    const id = currentRunId();
    setTweak('runState', 'Pre-run');
    setRejecting(false);
    pushToast(`Run #${id} rejected · Remarks: "${remarks}"`, 'error', 6000);
  };

  return (
    <React.Fragment>
      <TopNav role={t.role} setRole={v => setTweak('role', v)} pushToast={pushToast}/>
      <main>
        <InputsList cards={resolvedCards} shakeIds={shakeIds} onUpload={setModalCard} pushToast={pushToast} uploadDisabledReason={uploadDisabledReason}/>
      </main>
      <ActionBar
        cards={resolvedCards} role={t.role} runState={t.runState} setRunState={v => setTweak('runState', v)}
        checking={checking} lastChecked={lastChecked} onRecheck={triggerRecheck}
        onSoftLockShake={softLockShake} pushToast={pushToast}
        onReview={() => setReviewOpen(true)} onRequestReject={requestReject}
        onLogsOpen={() => setLogsOpen(true)} logStatus={logStatus}
      />
      <RunReviewDrawer
        open={reviewOpen} onClose={() => setReviewOpen(false)}
        role={t.role} runState={t.runState} cards={resolvedCards}
        pushToast={pushToast} onApprove={handleApprove} onRequestReject={requestReject}
      />
      <LogsDrawer open={logsOpen} onClose={() => setLogsOpen(false)} entries={logEntries} pushToast={pushToast}/>
      {rejecting && (
        <RejectionModal runId={currentRunId()} onClose={() => setRejecting(false)} onConfirm={confirmReject}/>
      )}
      {modalCard && (
        <UploadModal card={modalCard} onClose={() => setModalCard(null)} pushToast={pushToast} onSuccess={card => setFixedCards(f => ({ ...f, [card.id]: true }))}/>
      )}
      <ToastRack toasts={toasts}/>
      <TweaksPanel>
        <TweakSection label="Section A health"/>
        <TweakRadio label="Scenario" value={t.scenario} options={['All healthy','Mixed','Critical']} onChange={v => setTweak('scenario', v)}/>
        <TweakSection label="Cycle state"/>
        <TweakRadio label="Run state" value={t.runState} options={['Pre-run','Run complete','Approved']} onChange={v => setTweak('runState', v)}/>
      </TweaksPanel>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
